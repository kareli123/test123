<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jettoken Airdrop - Claim Free Tokens</title>

    <link rel="stylesheet" href="style.css?v=10">
    <link rel="tonconnect-manifest" href="tonconnect-manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 28C21.732 28 28 21.732 28 14C28 6.26801 21.732 0 14 0C6.26801 0 0 6.26801 0 14C0 21.732 6.26801 28 14 28Z" fill="#0098EA"/>
                <path d="M19.1419 8.75L13.9959 18.0649L8.84999 8.75H19.1419ZM20.8919 7H7.09999C6.28949 7 5.76211 7.8575 6.13606 8.575L13.0645 21.1172C13.4695 21.85 14.5225 21.85 14.9275 21.1172L21.856 8.575C22.2299 7.8575 21.7025 7 20.8919 7Z" fill="white"/>
            </svg>
            <span>Jettoken Airdrop</span>
        </div>
        <div id="ton-connect"></div>
    </header>

    <main class="main">
        <div class="swap-card">
            <div class="swap-header">
                <h2>Claim Free Tokens</h2>
            </div>

            <div class="airdrop-info">
                <div class="token-icon-large">
                    <div class="fake-icon large-icon">JTT</div>
                </div>
                <h3 class="token-title">Jettoken (JTT)</h3>
                <p class="token-desc">Connect your wallet and claim your free tokens. One claim per wallet.</p>
            </div>

            <div class="swap-details">
                <div class="detail-row">
                    <span>You receive</span>
                    <span class="highlight-amount">100 JTT</span>
                </div>
                <div class="detail-row">
                    <span>Cost</span>
                    <span>FREE</span>
                </div>
                <div class="detail-row">
                    <span>Limit</span>
                    <span>1 claim per wallet</span>
                </div>
                <div class="detail-row">
                    <span>Network</span>
                    <span>TON Mainnet</span>
                </div>
            </div>

            <button id="claimBtn" class="swap-btn">Connect Wallet</button>
            <div id="status" class="status-msg"></div>
        </div>
    </main>

    <script src="config.js?v=10"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
