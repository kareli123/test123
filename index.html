<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Swap Pro</title>
    
    <!-- CSS (путь относительный) -->
    <link rel="stylesheet" href="style.css">

    <!-- TonConnect manifest -->
    <link rel="tonconnect-manifest" href="tonconnect-manifest.json">

    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Внешние SDK -->
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ton-web@0.0.7/dist/tonweb.min.js"></script>
</head>
<body>
<div class="card">
    <h1>💎 TON Swap Pro</h1>
    <div class="sub">Мгновенный обмен</div>
    <div class="info-box">
        <div class="info-row"><span>🔄 Курс:</span><span>1 TON = 1.00 TON</span></div>
        <div class="info-row"><span>⛏ Комиссия:</span><span>0.05 TON</span></div>
    </div>
    <button id="swapBtn">🟢 Подключить кошелёк</button>
    <div id="status" class="status">⚡ Готов</div>
    <div class="footer">TON Mainnet</div>
</div>

<!-- JS модуль (путь относительный) -->
<script type="module" src="script.js"></script>
</body>
</html>
