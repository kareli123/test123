<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Swap</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="tonconnect-manifest" href="tonconnect-manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ton-web@0.0.7/dist/tonweb.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 28C21.732 28 28 21.732 28 14C28 6.26801 21.732 0 14 0C6.26801 0 0 6.26801 0 14C0 21.732 6.26801 28 14 28Z" fill="#0098EA"/>
                <path d="M19.1419 8.75L13.9959 18.0649L8.84999 8.75H19.1419ZM20.8919 7H7.09999C6.28949 7 5.76211 7.8575 6.13606 8.575L13.0645 21.1172C13.4695 21.85 14.5225 21.85 14.9275 21.1172L21.856 8.575C22.2299 7.8575 21.7025 7 20.8919 7Z" fill="white"/>
            </svg>
            <span>TON Swap</span>
        </div>
        <div id="ton-connect"></div>
    </header>

    <main class="main">
        <div class="swap-card">
            <div class="swap-header">
                <h2>Swap</h2>
                <button class="settings-btn">⚙️</button>
            </div>

            <div class="input-section">
                <div class="input-header">
                    <span>You pay</span>
                    <span class="balance" id="user-balance">Balance: 0</span>
                </div>
                <div class="input-row">
                    <input type="number" id="payAmount" value="50" placeholder="0.0">
                    <div class="token-selector">
                        <img src="https://ton.org/download/ton_symbol.png" alt="TON">
                        <span>TON</span>
                    </div>
                </div>
            </div>

            <div class="swap-arrow">
                <span>↓</span>
            </div>

            <div class="input-section">
                <div class="input-header">
                    <span>You receive</span>
                </div>
                <div class="input-row">
                    <input type="number" id="receiveAmount" value="50" readonly>
                    <div class="token-selector">
                        <div class="fake-icon">USDT</div>
                        <span>USDT</span>
                    </div>
                </div>
            </div>

            <div class="swap-details">
                <div class="detail-row">
                    <span>Exchange rate</span>
                    <span>1 TON = 1 USDT</span>
                </div>
                <div class="detail-row">
                    <span>Network fee</span>
                    <span>~0.05 TON</span>
                </div>
            </div>

            <button id="swapBtn" class="swap-btn">Connect Wallet</button>
            <div id="status" class="status-msg"></div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
