 <!DOCTYPE html>
     <html lang="ru">
     <head>
         <meta charset="UTF-8">
         <title>TON Connect</title>
         <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
         <style>
             body {
                 margin: 0;
                 min-height: 100vh;
                 display: flex;
                 flex-direction: column;
                 align-items: center;
                 justify-content: center;
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                 background: #0f1115;
                 color: #e6e6e6;
             }
             h1 {
                 font-weight: 500;
                 margin-bottom: 24px;
             }
             #ton-connect {
                 min-height: 48px;
             }
             #status {
                 margin-top: 20px;
                 font-size: 14px;
                 color: #8a8f98;
             }
         </style>
     </head>
     <body>
         <h1>TON Connect Demo</h1>
         <div id="ton-connect"></div>
         <div id="status">Кошелёк не подключён</div>

         <script>
             const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                 manifestUrl: 'https://kareli123.github.io/test123/tonconnect-manifest.json',
                 buttonRootId: 'ton-connect'
             });

             function onConnect(wallet) {
                 console.log('onConnect вызвана. Кошелёк:', wallet);
                 document.getElementById('status').innerText =
                     'Подключён: ' + wallet.account.address;
             }

             tonConnectUI.onStatusChange((wallet) => {
                 if (wallet) {
                     onConnect(wallet);
                 } else {
                     document.getElementById('status').innerText =
                         'Кошелёк не подключён';
                 }
             });
         </script>
     </body>
     </html>
