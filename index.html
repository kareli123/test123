<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TON Connect</title>
    <script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f1115;
            color: #e6e6e6;
        }
        main {
            width: min(560px, calc(100vw - 32px));
            padding: 32px;
            border: 1px solid #242833;
            border-radius: 20px;
            background: #151821;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        }
        h1 {
            font-weight: 500;
            margin: 0 0 24px;
            text-align: center;
        }
        label {
            display: block;
            margin: 16px 0 8px;
            font-size: 13px;
            color: #aeb4c0;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #303645;
            border-radius: 12px;
            background: #0f1115;
            color: #e6e6e6;
            font: inherit;
        }
        input[readonly] {
            color: #aeb4c0;
        }
        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px 16px;
            border: 0;
            border-radius: 12px;
            background: #2f80ed;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
        button.secondary {
            background: #252b38;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }
        #ton-connect {
            display: flex;
            justify-content: center;
            min-height: 48px;
        }
        #status,
        #balance,
        #tx-status {
            margin-top: 16px;
            font-size: 14px;
            color: #8a8f98;
            overflow-wrap: anywhere;
        }
        #tx-panel {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <main>
        <h1>TON Connect Demo</h1>
        <div id="ton-connect"></div>
        <div id="status">Кошелёк не подключён</div>
        <div id="balance">Баланс: —</div>

        <section id="tx-panel">
            <button id="refresh-balance" class="secondary" type="button">Обновить баланс</button>

            <label for="recipient">Адрес получателя транзакции</label>
            <input id="recipient" autocomplete="off" placeholder="EQ...">

            <label for="amount">Сумма списания в TON</label>
            <input id="amount" inputmode="decimal" placeholder="0.01">

            <button id="use-01" class="secondary" type="button">Сумма 0.1 TON</button>
            <button id="use-max" class="secondary" type="button">Подставить доступный баланс</button>
            <button id="send-test-tx" type="button">Отправить транзакцию</button>
            <div id="tx-status"></div>
        </section>
    </main>

    <script>
        const NANO_TON = 1000000000n;
        const FEE_RESERVE_NANO = 50000000n;
        const DEFAULT_RECIPIENT = 'UQAQLYfIYsVDgqXuV4tB8sLfOpNKkMOFB9LrDe05eWkIC7Jv';

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://kareli123.github.io/test123/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        const statusEl = document.getElementById('status');
        const balanceEl = document.getElementById('balance');
        const txPanelEl = document.getElementById('tx-panel');
        const recipientInput = document.getElementById('recipient');
        const amountInput = document.getElementById('amount');
        const refreshBalanceButton = document.getElementById('refresh-balance');
        const use01Button = document.getElementById('use-01');
        const useMaxButton = document.getElementById('use-max');
        const sendTestTxButton = document.getElementById('send-test-tx');
        const txStatusEl = document.getElementById('tx-status');

        let currentWallet = null;
        let currentBalanceNano = null;

        function getTonCenterUrl(chain) {
            return chain === '-3'
                ? 'https://testnet.toncenter.com/api/v2/getAddressBalance'
                : 'https://toncenter.com/api/v2/getAddressBalance';
        }

        function formatTon(nano) {
            const whole = nano / NANO_TON;
            const fraction = (nano % NANO_TON).toString().padStart(9, '0').replace(/0+$/, '');
            return fraction ? `${whole}.${fraction}` : whole.toString();
        }

        function parseTon(value) {
            const normalized = value.trim().replace(',', '.');
            if (!/^\d+(\.\d{1,9})?$/.test(normalized)) {
                throw new Error('Введите сумму в TON, максимум 9 знаков после точки');
            }

            const [whole, fraction = ''] = normalized.split('.');
            return BigInt(whole) * NANO_TON + BigInt(fraction.padEnd(9, '0'));
        }

        function isUserFriendlyAddress(address) {
            return /^[EU]Q[A-Za-z0-9_-]{46}$/.test(address);
        }

        function setTxStatus(message) {
            txStatusEl.innerText = message;
        }

        function updateTransactionControls() {
            const isConnected = Boolean(currentWallet);
            sendTestTxButton.disabled = !isConnected;
            use01Button.disabled = !isConnected;
            useMaxButton.disabled = !isConnected || currentBalanceNano === null;
            amountInput.disabled = !isConnected;
            recipientInput.readOnly = true;
        }

        async function fetchBalance(wallet) {
            const url = new URL(getTonCenterUrl(wallet.account.chain));
            url.searchParams.set('address', wallet.account.address);

            const response = await fetch(url);
            const data = await response.json();

            if (!response.ok || !data.ok) {
                throw new Error(data.error || 'Не удалось получить баланс');
            }

            return BigInt(data.result);
        }

        async function refreshBalance() {
            if (!currentWallet) {
                return;
            }

            balanceEl.innerText = 'Баланс: загрузка...';
            currentBalanceNano = await fetchBalance(currentWallet);
            balanceEl.innerText = `Баланс: ${formatTon(currentBalanceNano)} TON`;
            updateTransactionControls();
        }

        function fillMaxAmount() {
            if (currentBalanceNano === null) {
                setTxStatus('Сначала обновите баланс');
                return;
            }

            if (currentBalanceNano <= FEE_RESERVE_NANO) {
                amountInput.value = '';
                setTxStatus('Баланса недостаточно: нужен запас примерно 0.05 TON на комиссию');
                return;
            }

            amountInput.value = formatTon(currentBalanceNano - FEE_RESERVE_NANO);
            setTxStatus('Подставлена сумма баланса за вычетом резерва на комиссию');
        }

        function fillSmallAmount() {
            amountInput.value = '0.1';
            setTxStatus('Подставлена сумма 0.1 TON');
        }

        async function sendTransaction() {
            try {
                if (!currentWallet) {
                    throw new Error('Сначала подключите кошелёк');
                }

                const recipient = recipientInput.value.trim();
                const amountNano = parseTon(amountInput.value);

                if (!recipient) {
                    throw new Error('Укажите адрес получателя');
                }
                if (!isUserFriendlyAddress(recipient)) {
                    throw new Error('Неверный формат адреса получателя');
                }
                if (amountNano <= 0n) {
                    throw new Error('Сумма должна быть больше нуля');
                }

                sendTestTxButton.disabled = true;
                setTxStatus('Откройте кошелёк и подтвердите транзакцию...');

                await tonConnectUI.sendTransaction({
                    validUntil: Math.floor(Date.now() / 1000) + 300,
                    messages: [
                        {
                            address: recipient,
                            amount: amountNano.toString()
                        }
                    ]
                });

                setTxStatus('Транзакция отправлена. Обновляем баланс...');
                await refreshBalance();
            } catch (error) {
                setTxStatus(error.message || 'Не удалось отправить транзакцию');
            } finally {
                updateTransactionControls();
            }
        }

        async function onConnect(wallet) {
            currentWallet = wallet;

            console.log('onConnect вызвана. Кошелёк:', wallet);
            statusEl.innerText = `Подключён: ${wallet.account.address}`;
            recipientInput.value = DEFAULT_RECIPIENT;
            amountInput.value = '0.1';
            txPanelEl.style.display = 'block';
            setTxStatus('');
            updateTransactionControls();

            try {
                await refreshBalance();
            } catch (error) {
                balanceEl.innerText = 'Баланс: ошибка загрузки';
                setTxStatus(error.message || 'Не удалось получить баланс');
            }
        }

        function onDisconnect() {
            currentWallet = null;
            currentBalanceNano = null;
            statusEl.innerText = 'Кошелёк не подключён';
            balanceEl.innerText = 'Баланс: —';
            recipientInput.value = '';
            amountInput.value = '';
            txPanelEl.style.display = 'none';
            setTxStatus('');
        }

        refreshBalanceButton.addEventListener('click', async () => {
            try {
                await refreshBalance();
                setTxStatus('Баланс обновлён');
            } catch (error) {
                setTxStatus(error.message || 'Не удалось обновить баланс');
            }
        });
        use01Button.addEventListener('click', fillSmallAmount);
        useMaxButton.addEventListener('click', fillMaxAmount);
        sendTestTxButton.addEventListener('click', sendTransaction);

        tonConnectUI.onStatusChange((wallet) => {
            if (wallet) {
                onConnect(wallet);
            } else {
                onDisconnect();
            }
        });
    </script>
</body>
</html>
